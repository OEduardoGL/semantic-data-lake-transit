version: "2026-02-16"
ontology_ttl: "../docs/ontologia_transporte.ttl"
namespace: "http://example.org/tcc/transporte#"

silver_tables:
  gps_events:
    semantic_class: "tcc:EventoGPS"
    natural_key:
      strategy: "event_id+gps_idx"
      columns: ["event_id", "gps_idx"]
    object_links:
      - predicate: "tcc:temLinha"
        target_class: "tcc:Linha"
        source_column: "cod_linha"
      - predicate: "tcc:temVeiculo"
        target_class: "tcc:Veiculo"
        source_column: "cod_veiculo"
      - predicate: "tcc:temEmpresa"
        target_class: "tcc:Empresa"
        source_column: "id_empresa"
      - predicate: "tcc:temGaragem"
        target_class: "tcc:Garagem"
        source_column: "cod_garagem"
      - predicate: "tcc:temJornadaProgramacao"
        target_class: "tcc:JornadaProgramacao"
        source_column: "cod_tabela_programacao"
      - predicate: "tcc:temTipoMensagem"
        target_class: "tcc:TipoMensagemAVL"
        source_column: "tipo_mensagem"
    data_properties:
      - source: "event_id"
        property: "tcc:eventId"
        xsd: "xsd:string"
      - source: "event_ts"
        property: "tcc:eventTs"
        xsd: "xsd:long"
      - source: "event_dt"
        property: "tcc:eventDate"
        xsd: "xsd:date"
      - source: "gps_idx"
        property: "tcc:gpsIndex"
        xsd: "xsd:int"
      - source: "gps_sinal"
        property: "tcc:gpsSinal"
        xsd: "xsd:string"
      - source: "latitude"
        property: "tcc:latitude"
        xsd: "xsd:double"
      - source: "longitude"
        property: "tcc:longitude"
        xsd: "xsd:double"
      - source: "velocidade"
        property: "tcc:velocidade"
        xsd: "xsd:double"
      - source: "viagem_sentido"
        property: "tcc:sentidoViagem"
        xsd: "xsd:string"

  stop_events:
    semantic_class: "tcc:EventoParada"
    natural_key:
      strategy: "event_id+gps_idx"
      columns: ["event_id", "gps_idx"]
    object_links:
      - predicate: "tcc:temLinha"
        target_class: "tcc:Linha"
        source_column: "cod_linha"
      - predicate: "tcc:temVeiculo"
        target_class: "tcc:Veiculo"
        source_column: "cod_veiculo"
      - predicate: "tcc:temEmpresa"
        target_class: "tcc:Empresa"
        source_column: "id_empresa"
      - predicate: "tcc:temJornadaProgramacao"
        target_class: "tcc:JornadaProgramacao"
        source_column: "cod_tabela_programacao"
      - predicate: "tcc:temTipoMensagem"
        target_class: "tcc:TipoMensagemAVL"
        source_column: "tipo_mensagem"
      - predicate: "tcc:ocorreNoPonto"
        target_class: "tcc:PontoParada"
        source_column: "id_ponto"
    data_properties:
      - source: "event_id"
        property: "tcc:eventId"
        xsd: "xsd:string"
      - source: "event_ts"
        property: "tcc:eventTs"
        xsd: "xsd:long"
      - source: "event_dt"
        property: "tcc:eventDate"
        xsd: "xsd:date"
      - source: "gps_idx"
        property: "tcc:gpsIndex"
        xsd: "xsd:int"
      - source: "gps_sinal"
        property: "tcc:gpsSinal"
        xsd: "xsd:string"
      - source: "latitude"
        property: "tcc:latitude"
        xsd: "xsd:double"
      - source: "longitude"
        property: "tcc:longitude"
        xsd: "xsd:double"
      - source: "velocidade"
        property: "tcc:velocidade"
        xsd: "xsd:double"
      - source: "viagem_sentido"
        property: "tcc:sentidoViagem"
        xsd: "xsd:string"

  fare_events:
    semantic_class: "tcc:EventoTarifa"
    natural_key:
      strategy: "event_id+gps_idx"
      columns: ["event_id", "gps_idx"]
    object_links:
      - predicate: "tcc:temLinha"
        target_class: "tcc:Linha"
        source_column: "cod_linha"
      - predicate: "tcc:temVeiculo"
        target_class: "tcc:Veiculo"
        source_column: "cod_veiculo"
      - predicate: "tcc:temEmpresa"
        target_class: "tcc:Empresa"
        source_column: "id_empresa"
      - predicate: "tcc:temJornadaProgramacao"
        target_class: "tcc:JornadaProgramacao"
        source_column: "cod_tabela_programacao"
      - predicate: "tcc:temTipoMensagem"
        target_class: "tcc:TipoMensagemAVL"
        source_column: "tipo_mensagem"
    data_properties:
      - source: "event_id"
        property: "tcc:eventId"
        xsd: "xsd:string"
      - source: "event_ts"
        property: "tcc:eventTs"
        xsd: "xsd:long"
      - source: "event_dt"
        property: "tcc:eventDate"
        xsd: "xsd:date"
      - source: "gps_idx"
        property: "tcc:gpsIndex"
        xsd: "xsd:int"
      - source: "gps_sinal"
        property: "tcc:gpsSinal"
        xsd: "xsd:string"
      - source: "latitude"
        property: "tcc:latitude"
        xsd: "xsd:double"
      - source: "longitude"
        property: "tcc:longitude"
        xsd: "xsd:double"
      - source: "velocidade"
        property: "tcc:velocidade"
        xsd: "xsd:double"
      - source: "viagem_sentido"
        property: "tcc:sentidoViagem"
        xsd: "xsd:string"

  operational_events:
    semantic_class: "tcc:EventoOperacional"
    natural_key:
      strategy: "event_id+gps_idx"
      columns: ["event_id", "gps_idx"]
    object_links:
      - predicate: "tcc:temLinha"
        target_class: "tcc:Linha"
        source_column: "cod_linha"
      - predicate: "tcc:temVeiculo"
        target_class: "tcc:Veiculo"
        source_column: "cod_veiculo"
      - predicate: "tcc:temEmpresa"
        target_class: "tcc:Empresa"
        source_column: "id_empresa"
      - predicate: "tcc:temJornadaProgramacao"
        target_class: "tcc:JornadaProgramacao"
        source_column: "cod_tabela_programacao"
      - predicate: "tcc:temTipoMensagem"
        target_class: "tcc:TipoMensagemAVL"
        source_column: "tipo_mensagem"
    data_properties:
      - source: "event_id"
        property: "tcc:eventId"
        xsd: "xsd:string"
      - source: "event_ts"
        property: "tcc:eventTs"
        xsd: "xsd:long"
      - source: "event_dt"
        property: "tcc:eventDate"
        xsd: "xsd:date"
      - source: "gps_idx"
        property: "tcc:gpsIndex"
        xsd: "xsd:int"
      - source: "gps_sinal"
        property: "tcc:gpsSinal"
        xsd: "xsd:string"
      - source: "latitude"
        property: "tcc:latitude"
        xsd: "xsd:double"
      - source: "longitude"
        property: "tcc:longitude"
        xsd: "xsd:double"
      - source: "velocidade"
        property: "tcc:velocidade"
        xsd: "xsd:double"
      - source: "viagem_sentido"
        property: "tcc:sentidoViagem"
        xsd: "xsd:string"

semantic_rules_binding:
  fallback_keys_rule: "tcc:RegraFallbackChaves"
  canonical_timestamp_rule: "tcc:RegraTimestampCanonico"
  gps_invalid_rule: "tcc:RegraGPSInvalido"

notes:
  - "Jornada e sentido nao sao chave obrigatoria de join semantico."
  - "gpsIsInvalid deve ser derivado em camada analitica a partir de gps_sinal e coordenadas."
